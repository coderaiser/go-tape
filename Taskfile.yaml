version: "3"
tasks:
  test:
    desc: Run all unit tests
    cmds:
      - go test ./...
  coverage:
    desc: |
      Run tests with tape scoped to the library package only.
      run.go (CLI glue) is intentionally excluded.
    cmds:
      - go test -coverprofile=tape.out -covermode=atomic ./... > /dev/null
      - go tool cover -func=tape.out | grep 'tape\.go'
      - coverage
  build:
    desc: Build the binary for the current platform
    cmds:
      - go build -o tape ./cmd/tape
  release:snapshot:
    desc: |
      Dry-run GoReleaser locally — builds all platform binaries into ./dist
      without publishing. Requires goreleaser to be installed (brew install goreleaser).
    cmds:
      - goreleaser release --snapshot --clean
  release:check:
    desc: Validate .goreleaser.yaml without building
    cmds:
      - goreleaser check
  lint:
    desc: Run go vet
    cmds:
      - golangci-lint run
  fix:lint:
    desc: Run fix lint
    cmds:
      - golangci-lint run --fix
  clean:
    desc: Remove build artefacts
    cmds:
      - rm -f tape tape.out tape.html
      - rm -rf dist
  run:
    desc: |
      Run tape against a tape profile.
      Usage: task run -- -f myproject.out --code-frame
    cmds:
      - go run ./cmd/tape {{.CLI_ARGS}}
