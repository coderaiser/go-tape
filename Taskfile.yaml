version: '3'

tasks:
  test:
    cmds:
      - go test ./... -v -count=1

  coverage:
    cmds:
      - go test ./... -coverprofile=coverage.out
      - go tool cover -func=coverage.out | head -20

  lint:
    cmds:
      - go vet ./...

  build:
    cmds:
      - go build ./cmd/tape

  all:
    deps: [lint, test, coverage, build]
