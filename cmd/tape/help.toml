[usage]
text = "Usage: go-tape [options] [path]"

[[options]]
flag = "-h"
desc = "display this help and exit"

[[options]]
flag = "-v"
desc = "output version information and exit"

[[options]]
flag = "-f, --format format"
desc = "use a specific output format"
note = "default: progress-bar (tap on CI)\n                               values: tap|progress-bar|short|fail|time|json-lines"

[[options]]
flag = "--no-check-scopes"
desc = "do not check that messages contain scope: 'scope: message'"

[[options]]
flag = "--no-check-assertions-count"
desc = "do not check that assertion count is no more than 1"

[[options]]
flag = "--no-check-duplicates"
desc = "do not check messages for duplicates"

[[options]]
flag = "--mode mode"
desc = "run mode: interp (ixgo, default) or gotest (go test subprocess)"

[[options]]
flag = "-c, --coverage [format]"
desc = "show coverage after tests"
note = "default format: lines  values: lines|code-frame|json-lines"

[[options]]
flag = "-r, --report [file]"
desc = "write lcov report to file (default: coverage.lcov)"
note = "requires -c"

[[env]]
name = "TAPE_PROGRESS_BAR"
desc = "force progress bar on (1) or off (0)"

[[env]]
name = "TAPE_PROGRESS_BAR_MIN"
desc = "minimum test count to show progress bar (default: 10)"

[[env]]
name = "TAPE_PROGRESS_BAR_COLOR"
desc = "progress bar color (ANSI escape or hex, default: yellow)"

[[env]]
name = "TAPE_PROGRESS_BAR_STACK"
desc = "set to 0 to hide error stack traces"

[[env]]
name = "TAPE_TIMEOUT"
desc = "per-test timeout (default: 3s, e.g. TAPE_TIMEOUT=30s)"

[[env]]
name = "TAPE_CHECK_SCOPES"
desc = "set to 0 to disable scope format check (default: 1)"

[[env]]
name = "TAPE_CHECK_ASSERTIONS_COUNT"
desc = "set to 0 to allow more than one assertion per test (default: 1)"

[[env]]
name = "TAPE_CHECK_SKIPPED"
desc = "set to 1 to exit with error when skipped tests exist (default: 0)"

[[env]]
name = "TAPE_CHECK_DUPLICATES"
desc = "set to 0 to disable duplicate message check (default: 1)"
